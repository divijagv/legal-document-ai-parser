name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./
            publish_branch: gh-pages
            # Only the static web app needs to be public; keep the Flask
            # backend's local-only files out of the published site.
            exclude_assets: '.github,app.py,main.py,legal_parser_agent,templates,static,tests,benchmark,Procfile,requirements.txt,pyproject.toml,instructions.txt,.venv,.gitignore'
